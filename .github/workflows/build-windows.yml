name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

- name: Build EXE (PySide6 onedir)
  run: |
    pyinstaller `
      --onedir `
      --windowed `
      --clean `
      --collect-all PySide6 `
      --collect-all shiboken6 `
      main.py


    - name: Zip artifact
      run: |
        powershell Compress-Archive dist/main JiuYinDance-Windows.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: JiuYinDance-Windows
        path: JiuYinDance-Windows.zip
